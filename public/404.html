<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>这一页没有声音 · 云声 Yunsheng</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07070a">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/theme-init.js"></script>
<style>
  .nf {
    min-height: 82vh;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 60px;
    padding: 0 var(--gut);
    max-width: var(--maxw);
    margin: 0 auto;
  }
  .nf .code {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--red);
  }
  .nf h1 {
    font-size: clamp(44px, 8vw, 96px);
    line-height: 0.94;
    letter-spacing: -0.045em;
    margin: 22px 0 0;
    font-weight: 750;
  }
  .nf h1 .outline {
    color: transparent;
    -webkit-text-stroke: 1px var(--paper-4);
  }
  .nf p {
    margin: 24px 0 0;
    color: var(--paper-2);
    font-size: 15px;
    line-height: 1.85;
    max-width: 40ch;
  }
  .nf .hero-actions { margin-top: 36px; }
  .disc-404 {
    width: min(30vw, 260px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: repeating-radial-gradient(circle at 50% 50%,
      #15151a 0 1px, #0c0c11 1px 3px, #101015 3px 4px);
    box-shadow: 0 0 0 1px rgba(244,241,234,0.08), 0 40px 80px -20px rgba(0,0,0,0.9),
      inset 0 0 60px rgba(0,0,0,0.95);
    position: relative;
    display: grid;
    place-items: center;
    animation: rotate 26s linear infinite;
  }
  .disc-404::after {
    content: "";
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: linear-gradient(150deg, #d8452c, #8e2216);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
  }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @media (max-width: 760px) {
    .nf { grid-template-columns: 1fr; min-height: 76vh; gap: 44px; padding-top: 40px; }
    .disc-404 { width: 46vw; order: -1; }
  }
</style>
</head>
<body>
  <div class="nf">
    <div>
      <div class="code">ERROR 404</div>
      <h1>这一页<br><span class="outline">没有声音</span>.</h1>
      <p>地址可能写错了，或者这个页面还没被唱出来。回首页听点别的。</p>
      <div class="hero-actions">
        <a class="btn btn-solid" href="/">回到首页</a>
        <a class="btn btn-line" href="https://github.com/wang111928/yunsheng-player/releases" target="_blank" rel="noopener">下载云声</a>
      </div>
    </div>
    <div class="disc-404" aria-hidden="true"></div>
  </div>
</body>
</html>
